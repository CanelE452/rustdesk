name: Android native keyboard-cover compile

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-samsung-input
    paths:
      - '.github/workflows/android-native-input-compile.yml'
      - 'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainActivity.kt'
      - 'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/PersonalRemoteInput.kt'

permissions:
  contents: read

jobs:
  compile-kotlin:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Compile Android Kotlin without APK packaging
        working-directory: flutter/android
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace

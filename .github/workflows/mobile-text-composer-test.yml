name: Personal RustDesk feature tests (including Samsung hardware)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/personal-multiplatform
      - feature/samsung-hardware-input
      - fix/android-touchpad-fkeys-diagnostics
    paths:
      - '.github/workflows/mobile-text-composer-test.yml'
      - 'flutter/lib/mobile/pages/remote_page.dart'
      - 'flutter/lib/mobile/hardware_input_protocol.dart'
      - 'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainActivity.kt'
      - 'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/RemoteHardwareInput.kt'
      - 'flutter/lib/mobile/widgets/composed_text_sheet.dart'
      - 'flutter/lib/desktop/pages/connection_page.dart'
      - 'flutter/lib/desktop/utils/two_window_layout.dart'
      - 'flutter/lib/utils/multi_window_manager.dart'
      - 'flutter/test/composed_text_sheet_test.dart'
      - 'flutter/test/hardware_input_protocol_test.dart'
      - 'flutter/test/two_window_layout_test.dart'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Widget and window layout tests
        working-directory: flutter
        run: flutter test test/composed_text_sheet_test.dart test/two_window_layout_test.dart test/hardware_input_protocol_test.dart
      - name: Dart syntax validation
        working-directory: flutter
        run: dart format --output=none lib/mobile/pages/remote_page.dart lib/mobile/widgets/composed_text_sheet.dart lib/mobile/hardware_input_protocol.dart lib/desktop/pages/connection_page.dart lib/desktop/utils/two_window_layout.dart lib/utils/multi_window_manager.dart test/composed_text_sheet_test.dart test/two_window_layout_test.dart test/hardware_input_protocol_test.dart
      - name: Analyze modified sources and tests
        working-directory: flutter
        run: flutter analyze --no-fatal-infos lib/mobile/pages/remote_page.dart lib/mobile/widgets/composed_text_sheet.dart lib/mobile/hardware_input_protocol.dart lib/desktop/pages/connection_page.dart lib/desktop/utils/two_window_layout.dart lib/utils/multi_window_manager.dart test/composed_text_sheet_test.dart test/two_window_layout_test.dart test/hardware_input_protocol_test.dart

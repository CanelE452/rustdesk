name: Publish verified Android Recovery Test APK to direct download

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-android-recoverytest.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-android-recoverytest-v012
  cancel-in-progress: false

jobs:
  publish:
    name: Promote successful Recovery Test APK to direct download
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository for direct-download branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download APK only from the confirmed successful build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=40868797058
          status="$(gh run view "$run_id" --repo "$GH_REPO" --json conclusion --jq '.conclusion')"
          test "$status" = 'success'
          mkdir -p downloaded
          gh run download "$run_id" --repo "$GH_REPO" \
            --name RustDesk-RecoveryTest-Android-arm64 \
            --dir downloaded
          echo 'Downloaded artifact entries:'
          find downloaded -maxdepth 3 -type f -print
          test "$(find downloaded -type f -name '*.apk' | wc -l)" -eq 1
          test -s downloaded/RustDesk-RecoveryTest-Android-arm64.apk
          mkdir -p release
          cp downloaded/RustDesk-RecoveryTest-Android-arm64.apk \
             release/RustDesk-Personal-Android-RecoveryTest-arm64.apk

      - name: Verify APK signature, target package and manifest
        run: |
          set -euo pipefail
          apk='release/RustDesk-Personal-Android-RecoveryTest-arm64.apk'
          test -s "$apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 \
            -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
          "$BUILD_TOOLS/aapt" dump badging "$apk" | head -n 8
          "$BUILD_TOOLS/aapt" dump badging "$apk" |
            grep -Fq "package: name='com.carriez.flutter_hbb.personal.client.recoverytest'"
          "$BUILD_TOOLS/aapt" dump xmltree "$apk" AndroidManifest.xml \
            > /tmp/recoverytest-android-manifest.txt
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|InputService|MainService|RECORD_AUDIO|SYSTEM_ALERT_WINDOW|RECEIVE_BOOT_COMPLETED' \
            /tmp/recoverytest-android-manifest.txt; then
            echo 'Unexpected incoming-control service or sensitive permission' >&2
            exit 1
          fi
          (cd release && sha256sum RustDesk-Personal-Android-RecoveryTest-arm64.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish verified APK to an orphan direct-download branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch='personal-apk-downloads'
          if git ls-remote --heads origin "$branch" | grep -q .; then
            echo 'Binary download branch already exists. Refusing to overwrite without review.' >&2
            exit 1
          fi
          temp_dir="$(mktemp -d)"
          cp release/RustDesk-Personal-Android-RecoveryTest-arm64.apk "$temp_dir/"
          cp release/SHA256SUMS.txt "$temp_dir/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan "$branch"
          git rm -rf --quiet .
          cp "$temp_dir/RustDesk-Personal-Android-RecoveryTest-arm64.apk" .
          cp "$temp_dir/SHA256SUMS.txt" .
          cat > README.md <<'EOF'
          # Experimental Android direct download

          The binary in this branch is the previously validated build from
          GitHub Actions run 40868797058, source commit
          d5d40e0c6cba8bb3a442b0ddabda18b414a9e641.

          This is a phone/tablet test APK, not a verified production release.
          It has a separate app ID and a debug signing certificate.
          It contains experimental touchpad, F-key and app-return recovery
          logic. If Google Play Protect blocks installation, stop rather
          than bypass the warning.
          EOF
          git add README.md RustDesk-Personal-Android-RecoveryTest-arm64.apk SHA256SUMS.txt
          git commit -m 'binary(android): publish verified recovery-test APK for direct download'
          git push origin HEAD:refs/heads/"$branch"
          echo "APK direct link:"
          echo "https://raw.githubusercontent.com/$GH_REPO/$branch/RustDesk-Personal-Android-RecoveryTest-arm64.apk"
          echo 'Checksum:'
          cat SHA256SUMS.txt

name: Publish verified Android Recovery Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-android-recoverytest.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-android-recoverytest-v012
  cancel-in-progress: false

jobs:
  publish:
    name: Promote successful Recovery Test APK to direct download
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download APK only from the confirmed successful build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=40868797058
          status="$(gh run view "$run_id" --repo "$GH_REPO" --json conclusion --jq '.conclusion')"
          test "$status" = 'success'
          mkdir -p downloaded
          gh run download "$run_id" --repo "$GH_REPO" \
            --name RustDesk-RecoveryTest-Android-arm64 \
            --dir downloaded
          echo 'Downloaded artifact entries:'
          find downloaded -maxdepth 3 -type f -print
          test "$(find downloaded -type f -name '*.apk' | wc -l)" -eq 1
          test -s downloaded/RustDesk-RecoveryTest-Android-arm64.apk
          mkdir -p release
          cp downloaded/RustDesk-RecoveryTest-Android-arm64.apk \
             release/RustDesk-Personal-Android-RecoveryTest-arm64.apk

      - name: Verify APK signature, target package and manifest
        run: |
          set -euo pipefail
          apk='release/RustDesk-Personal-Android-RecoveryTest-arm64.apk'
          test -s "$apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 \
            -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
          "$BUILD_TOOLS/aapt" dump badging "$apk" | head -n 8
          "$BUILD_TOOLS/aapt" dump badging "$apk" |
            grep -Fq "package: name='com.carriez.flutter_hbb.personal.client.recoverytest'"
          "$BUILD_TOOLS/aapt" dump xmltree "$apk" AndroidManifest.xml \
            > /tmp/recoverytest-android-manifest.txt
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|InputService|MainService|RECORD_AUDIO|SYSTEM_ALERT_WINDOW|RECEIVE_BOOT_COMPLETED' \
            /tmp/recoverytest-android-manifest.txt; then
            echo 'Unexpected incoming-control service or sensitive permission' >&2
            exit 1
          fi
          (cd release && sha256sum RustDesk-Personal-Android-RecoveryTest-arm64.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish test APK as a direct-download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='personal-android-recoverytest-v0.1.2'
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'The release tag already exists. Refusing to replace its signature.' >&2
            exit 1
          fi
          gh release create "$tag" \
            release/RustDesk-Personal-Android-RecoveryTest-arm64.apk \
            release/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --target d5d40e0c6cba8bb3a442b0ddabda18b414a9e641 \
            --title 'RustDesk Personal Android Recovery Test (ARM64)' \
            --notes 'Experimental Android phone/tablet APK built successfully in workflow run 40868797058. Includes keyboard-cover touchpad/F-key diagnostics and bounded app-return network recovery. Original build SHA: d5d40e0c6cba8bb3a442b0ddabda18b414a9e641. Uses a separate test package ID and debug certificate. Not tested on the physical Samsung device; not verified to fix all background disconnects. Android Play Protect may still block installation; do not bypass a security warning. Download the APK directly via the release asset; Android always asks the user to confirm installation.' \
            --prerelease
          gh release view "$tag" --repo "$GH_REPO" --json url,assets

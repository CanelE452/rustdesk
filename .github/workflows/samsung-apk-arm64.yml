name: Build Samsung tablet RustDesk APK (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/samsung-hardware-input
    paths:
      - '.github/workflows/samsung-apk-arm64.yml'

permissions:
  contents: read

env:
  RUST_VERSION: '1.75'
  CARGO_NDK_VERSION: '3.1.2'
  NDK_VERSION: 'r28c'
  ANDROID_FLUTTER_VERSION: '3.24.5'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  apk-arm64:
    name: Build installable ARM64 APK
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export actions binary cache
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout RustDesk fork including submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev \
            libclang-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev \
            libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget

      - name: Install Flutter matching upstream Android build
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Apply upstream Flutter 3.24.5 patch
        run: |
          cd "$(dirname "$(dirname "$(command -v flutter)")")"
          git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Set up vcpkg binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Build Android ARM64 native dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./flutter/build_android_deps.sh arm64-v8a

      - name: Restore upstream-generated Flutter/Rust bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c1c64a875d1fc6a0a
        with:
          name: bridge-artifact
          path: ./

      - name: Confirm bridge outputs are present
        run: |
          test -s flutter/lib/generated_bridge.dart
          test -s src/bridge_generated.rs
          test -s src/bridge_generated.io.rs

      - name: Install upstream Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: rustfmt

      - name: Cache ARM64 Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: personal-rustdesk-android-arm64

      - name: Build RustDesk ARM64 JNI library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version "${{ env.CARGO_NDK_VERSION }}" --locked
          ./flutter/ndk_arm64.sh
          test -s ./target/aarch64-linux-android/release/liblibrustdesk.so
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so \
            flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Configure independent personal app ID and installable debug signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("flutter/android/app/build.gradle")
          src = p.read_text()
          original = 'applicationId "com.carriez.flutter_hbb"'
          assert src.count(original) == 1, "Upstream Android applicationId contract changed"
          src = src.replace(original, original + '\n        applicationIdSuffix ".personal"')
          original = "signingConfig signingConfigs.release"
          assert src.count(original) == 1, "Upstream Android signing contract changed"
          src = src.replace(original, "signingConfig signingConfigs.debug")
          p.write_text(src)
          gradle = Path("flutter/android/gradle.properties")
          props = gradle.read_text()
          assert "org.gradle.jvmargs=-Xmx1024M" in props, "Gradle memory contract changed"
          props = props.replace(
              "org.gradle.jvmargs=-Xmx1024M",
              "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g",
          )
          gradle.write_text(props)
          PY
          echo "This personal package uses an ephemeral debug signing key."
          echo "It can coexist with official RustDesk but cannot be upgraded"
          echo "by APKs signed with different keys."

      - name: Build ARM64 release-mode APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          cd flutter
          flutter pub get
          flutter build apk --release --no-shrink --target-platform android-arm64 --split-per-abi
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            ../RustDesk-Personal-Samsung-arm64.apk

      - name: Verify APK manifest and signature
        run: |
          test -s RustDesk-Personal-Samsung-arm64.apk
          ls -lh RustDesk-Personal-Samsung-arm64.apk
          sha256sum RustDesk-Personal-Samsung-arm64.apk | tee apk.sha256
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${BUILD_TOOLS}/aapt" dump badging RustDesk-Personal-Samsung-arm64.apk | head -n 15
          "${BUILD_TOOLS}/apksigner" verify --verbose RustDesk-Personal-Samsung-arm64.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RustDesk-Personal-Samsung-arm64
          path: |
            RustDesk-Personal-Samsung-arm64.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 30

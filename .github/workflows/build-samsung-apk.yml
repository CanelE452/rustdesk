name: Build personal Samsung ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/samsung-hardware-input
    paths:
      - '.github/workflows/build-samsung-apk.yml'

permissions:
  contents: read

env:
  RUST_VERSION: '1.75'
  FLUTTER_VERSION: '3.24.5'
  NDK_VERSION: 'r28c'
  CARGO_NDK_VERSION: '3.1.2'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  android-arm64:
    name: Android ARM64 installable APK
    needs: bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Cache export for vcpkg
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Checkout RustDesk including submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Apply RustDesk Flutter patch
        shell: bash
        run: |
          cd "$(dirname "$(dirname "$(command -v flutter)")")"
          git apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - name: Android NDK r28c
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: 'r28c'
          add-to-path: true
      - name: vcpkg checkout and cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Android ARM64 dependency build
        run: ./flutter/build_android_deps.sh arm64-v8a
      - name: Download generated Rust/Flutter bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c1c64a875d1fc6a0a
        with:
          name: bridge-artifact
          path: ./
      - name: Rust 1.75
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.75'
          targets: aarch64-linux-android
          components: rustfmt
      - name: Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: personal-samsung-android
          key: arm64-v8a
      - name: Build Android Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          ./flutter/ndk_arm64.sh
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so \
            flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            flutter/android/app/src/main/jniLibs/arm64-v8a/
      - name: Build installable ARM64 APK (debug signing)
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' flutter/android/gradle.properties
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' flutter/android/app/build.gradle
          cd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          mkdir -p ../personal-apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../personal-apk/rustdesk-samsung-arm64.apk
      - name: Publish direct-download build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-samsung-arm64
          path: personal-apk/rustdesk-samsung-arm64.apk
          if-no-files-found: error
          retention-days: 30
